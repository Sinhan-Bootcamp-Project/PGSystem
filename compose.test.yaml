services:
  gateway:
    environment:
      OIDC_ISSUER: http://localhost:28081/realms/food
    ports: !override ["127.0.0.1:28080:8080"]
  order-service:
    environment:
      OIDC_ISSUER: http://localhost:28081/realms/food
  order-worker:
    environment:
      OIDC_ISSUER: http://localhost:28081/realms/food
  agent-service:
    environment:
      AI_MODE: fixture
      RAG_EMBEDDING_MODEL: ""
      OIDC_ISSUER: http://localhost:28081/realms/food
  benefit-service:
    environment:
      OIDC_ISSUER: http://localhost:28081/realms/food
  control-service:
    environment:
      OIDC_ISSUER: http://localhost:28081/realms/food
  payment-service:
    environment:
      OIDC_ISSUER: http://localhost:28081/realms/food
      ENABLE_FAULTS: "true"
      SETTLEMENT_SCHEDULE_ENABLED: "false"
  fep-service:
    environment:
      OIDC_ISSUER: http://localhost:28081/realms/food
      ENABLE_FAULTS: "true"
  institution-simulator:
    environment:
      OIDC_ISSUER: http://localhost:28081/realms/food
      ENABLE_FAULTS: "true"
      ALLOW_EARLY_CLOSE: "true"
  merchant-simulator:
    environment:
      OIDC_ISSUER: http://localhost:28081/realms/food
      ENABLE_FAULTS: "true"
  keycloak:
    environment:
      KC_HOSTNAME: http://localhost:28081
    ports: !override ["127.0.0.1:28081:8080"]
